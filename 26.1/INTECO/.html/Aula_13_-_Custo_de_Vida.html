<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quiz - Aula 13: Custo de Vida</title>
<style>
:root{--destaque:#bf0021;--verde:#008000;--azul:#0066cc;--cinza:#646464;--amarelo:#ffc107;--laranja:#e67e22;--bg:#f8f9fa;--card:#fff}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif;background:var(--bg);color:#333;line-height:1.6}
.container{max-width:800px;margin:0 auto;padding:16px}
header{background:linear-gradient(135deg,var(--destaque),#8b0015);color:#fff;text-align:center;padding:32px 16px}
header h1{font-size:1.6em;margin-bottom:4px}
header p{font-size:.95em;opacity:.9}
#tela-inicio{text-align:center;padding:40px 16px}
#tela-inicio p{margin-bottom:20px;font-size:1.05em;color:var(--cinza)}
.btn-principal{background:var(--destaque);color:#fff;border:none;padding:14px 40px;font-size:1.1em;border-radius:8px;cursor:pointer;transition:background .2s}
.btn-principal:hover{background:#8b0015}
#painel-progresso{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:16px 0;padding:12px;background:var(--card);border-radius:10px;box-shadow:0 1px 4px rgba(0,0,0,.08)}
.principio-badge{text-align:center;padding:6px 2px;border-radius:6px;font-size:.72em;font-weight:600;transition:all .3s;border:2px solid #ddd;background:#f5f5f5;color:var(--cinza)}
.principio-badge.acertou{background:#d4edda;border-color:var(--verde);color:var(--verde)}
.principio-badge.errou{background:#f8d7da;border-color:var(--destaque);color:var(--destaque)}
.principio-badge.reforco{background:#fff3cd;border-color:var(--amarelo);color:#856404}
.principio-badge .num{font-size:1.3em;display:block}
#card-questao{background:var(--card);border-radius:12px;box-shadow:0 2px 8px rgba(0,0,0,.1);padding:24px;margin:16px 0}
.questao-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
.questao-tag{background:var(--azul);color:#fff;padding:4px 12px;border-radius:20px;font-size:.8em;font-weight:600}
.questao-tag.reforco-tag{background:var(--laranja)}
.questao-contador{font-size:.85em;color:var(--cinza)}
.questao-contexto{background:#e8f4fd;border-left:4px solid var(--azul);padding:12px 16px;margin-bottom:16px;border-radius:0 8px 8px 0;font-size:.95em}
.questao-texto{font-size:1.05em;font-weight:500;margin-bottom:20px}
.alternativas{list-style:none}
.alternativa{display:block;width:100%;text-align:left;padding:12px 16px;margin-bottom:8px;border:2px solid #ddd;border-radius:8px;background:#fff;cursor:pointer;font-size:.95em;transition:all .2s}
.alternativa:hover:not(.disabled){border-color:var(--azul);background:#f0f7ff}
.alternativa.correta{border-color:var(--verde);background:#d4edda;font-weight:600}
.alternativa.incorreta{border-color:var(--destaque);background:#f8d7da}
.alternativa.disabled{cursor:default;opacity:.7}
.alternativa.disabled.correta{opacity:1}
.feedback{margin-top:16px;padding:16px;border-radius:8px;display:none;font-size:.95em}
.feedback.acerto{background:#d4edda;border:1px solid var(--verde);color:#155724}
.feedback.erro{background:#f8d7da;border:1px solid var(--destaque);color:#721c24}
.feedback h4{margin-bottom:6px}
.btn-proximo{display:none;margin-top:16px;padding:10px 28px;background:var(--azul);color:#fff;border:none;border-radius:8px;font-size:1em;cursor:pointer;transition:background .2s}
.btn-proximo:hover{background:#004a99}
#tela-resultado{display:none;text-align:center;padding:32px 16px}
#tela-resultado h2{margin-bottom:8px;color:var(--destaque)}
.nota-final{font-size:3em;font-weight:700;margin:16px 0}
.nota-final.boa{color:var(--verde)}.nota-final.media{color:var(--laranja)}.nota-final.baixa{color:var(--destaque)}
#resultado-detalhes{text-align:left;margin:24px 0;background:var(--card);border-radius:10px;padding:20px;box-shadow:0 1px 4px rgba(0,0,0,.08)}
#resultado-detalhes h3{margin-bottom:12px;color:var(--azul)}
.resultado-item{display:flex;align-items:center;padding:8px 0;border-bottom:1px solid #eee;font-size:.92em}
.resultado-item:last-child{border-bottom:none}
.resultado-icone{font-size:1.3em;margin-right:10px;width:28px;text-align:center}
.resultado-nome{flex:1}
.resultado-status{font-weight:600;font-size:.85em;padding:2px 10px;border-radius:12px}
.status-dominado{background:#d4edda;color:#155724}
.status-reforcar{background:#fff3cd;color:#856404}
.status-revisar{background:#f8d7da;color:#721c24}
.dica-estudo{margin-top:20px;padding:16px;background:#e8f4fd;border-radius:8px;text-align:left;font-size:.93em}
.dica-estudo h4{color:var(--azul);margin-bottom:8px}
.dica-estudo ul{margin-left:20px}
.dica-estudo li{margin-bottom:4px}
.btn-reiniciar{margin-top:20px;padding:12px 32px;background:var(--destaque);color:#fff;border:none;border-radius:8px;font-size:1em;cursor:pointer}
@media(max-width:500px){#painel-progresso{grid-template-columns:repeat(2,1fr);gap:4px}.principio-badge{font-size:.65em;padding:4px 1px}header h1{font-size:1.3em}}
</style>
</head>
<body>
<header>
<h1>Custo de Vida</h1>
<p>Quiz Adaptativo — Aula 13 · Introdução à Economia · UnB</p>
</header>
<div class="container">
<div id="tela-inicio">
<p>Este quiz avalia sua compreensão de <strong>IPCA, inflação, valores reais e juros reais</strong> (Mankiw, Cap. 24).<br>Se errar uma questão principal, você receberá uma <strong>explicação</strong> e um <strong>exercício de reforço</strong>.</p>
<button class="btn-principal" onclick="iniciarQuiz()">Começar Quiz</button>
</div>
<div id="painel-progresso" style="display:none"></div>
<div id="card-questao" style="display:none">
<div class="questao-header"><span class="questao-tag" id="tag-principio"></span><span class="questao-contador" id="contador"></span></div>
<div class="questao-contexto" id="contexto"></div>
<div class="questao-texto" id="texto-questao"></div>
<ul class="alternativas" id="alternativas"></ul>
<div class="feedback" id="feedback"></div>
<button class="btn-proximo" id="btn-proximo" onclick="proximaQuestao()">Próxima →</button>
</div>
<div id="tela-resultado">
<h2>Resultado Final</h2>
<div class="nota-final" id="nota-final"></div>
<p id="msg-resultado"></p>
<div id="resultado-detalhes"></div>
<div class="dica-estudo" id="dica-estudo" style="display:none"></div>
<button class="btn-reiniciar" onclick="location.reload()">Refazer Quiz</button>
</div>
</div>
<script>
var BANCO=[
{principio:1,tipo:"principal",contexto:"No Brasil, o índice oficial de inflação é calculado pelo IBGE com base em uma cesta de consumo das famílias urbanas.",texto:"O índice oficial de inflação no Brasil é:",alternativas:["O deflator do PIB","O IPCA (Índice de Preços ao Consumidor Amplo)","A Selic","O salário mínimo"],correta:1,explicacao:"O <strong>IPCA</strong> (IBGE) é o índice oficial de inflação. É a referência da <strong>meta de inflação</strong> do Banco Central. Atualmente, a meta é 3,0% a.a. (com tolerância de ±1,5 p.p.)."},
{principio:1,tipo:"reforco",contexto:"O IPCA usa uma cesta fixa (POF) e pesos médios das famílias urbanas. É calculado pelo IBGE mensalmente.",texto:"Qual destas afirmações sobre o IPCA está CORRETA?",alternativas:["Mede preços de bens de capital (máquinas)","Não inclui produtos importados","Usa cesta de consumo das famílias com pesos da POF","É calculado pelo Banco Central"],correta:2,explicacao:"O IPCA usa <strong>cesta de consumo</strong> definida pela <strong>POF</strong> (Pesquisa de Orçamentos Familiares). Inclui importados consumidos por famílias e exclui bens de capital. É calculado pelo <strong>IBGE</strong>."},
{principio:2,tipo:"principal",contexto:"Dona Lúcia gasta R$ 2.000/mês assim: R$ 400 em arroz/feijão (peso 20%), R$ 600 em gasolina (peso 30%), R$ 1.000 em aluguel (peso 50%). No ano, arroz subiu 20%, gasolina 10%, aluguel 6%.",texto:"A inflação pessoal de Dona Lúcia foi:",alternativas:["6% (média simples baixa)","12% (média simples)","10% (média ponderada: 0,2×20 + 0,3×10 + 0,5×6)","36% (soma das altas)"],correta:2,explicacao:"Inflação ponderada pelos <strong>pesos da cesta</strong>: 0,20 × 20% + 0,30 × 10% + 0,50 × 6% = 4% + 3% + 3% = <strong>10%</strong>. Sua cesta passou de R$ 2.000 para R$ 2.200."},
{principio:2,tipo:"reforco",contexto:"A inflação de uma cesta é a média ponderada das variações de preços pelos pesos de cada item.",texto:"Em uma cesta com peso 70% em alimentos e 30% em transporte: alimentos subiram 5% e transporte 15%. A inflação da cesta foi:",alternativas:["20% (soma)","10% (média simples)","8% (0,7×5 + 0,3×15)","5%"],correta:2,explicacao:"Média ponderada: 0,70 × 5% + 0,30 × 15% = 3,5% + 4,5% = <strong>8%</strong>. Quem gasta mais em alimentos sente menos quando o transporte sobe."},
{principio:3,tipo:"principal",contexto:"Em 2003, o salário mínimo era R$ 240. Em 2025, é R$ 1.518. O IPCA acumulado no período foi de aproximadamente 280% (ou seja, multiplicador de 3,8).",texto:"O ganho REAL (poder de compra) do salário mínimo entre 2003 e 2025 foi de aproximadamente:",alternativas:["533% (variação nominal)","280% (a inflação)","66% (variação real)","Zero"],correta:2,explicacao:"R$ 240 de 2003 valem 240 × 3,8 ≈ <strong>R$ 912</strong> em R$ de 2025. Comparado com R$ 1.518: 1.518/912 − 1 ≈ <strong>66%</strong> de ganho real. Sem corrigir pela inflação, o aumento parece muito maior do que é."},
{principio:3,tipo:"reforco",contexto:"Para comparar valores de R$ entre anos diferentes, é preciso corrigir pela inflação: Valor_A = Valor_B × (IPC_A / IPC_B).",texto:"Em 2010, seu aluguel custava R$ 800. O IPCA acumulado entre 2010 e 2025 foi de 100% (dobrou). Quanto seria R$ 800 de 2010 em R$ de 2025?",alternativas:["R$ 800 (o mesmo valor)","R$ 1.600 (dobrou)","R$ 400 (caiu pela metade)","Não é possível calcular"],correta:1,explicacao:"R$ 800 × (200/100) = R$ 800 × 2 = <strong>R$ 1.600</strong>. Para manter o mesmo poder de compra, o aluguel em 2025 precisaria custar R$ 1.600."},
{principio:4,tipo:"principal",contexto:"Você aplica R$ 10.000 no Tesouro Selic que rende 10,5% ao ano. A inflação no período foi de 4,5%.",texto:"A taxa de juros REAL aproximada da aplicação foi:",alternativas:["10,5%","15%","≈ 6% (Fisher: nominal − inflação)","-4,5%"],correta:2,explicacao:"Equação de Fisher (aproximada): <strong>r_real ≈ r_nominal − inflação</strong> = 10,5% − 4,5% = <strong>6%</strong>. Em R$, isso é ≈ R$ 600 de ganho de poder de compra em 10 mil aplicados."},
{principio:4,tipo:"reforco",contexto:"Inflação corrói poder de compra. O que importa é o JURO REAL, não o nominal.",texto:"A poupança rendeu 6% no ano e a inflação foi de 9%. O juro real foi:",alternativas:["+15%","+6%","Aproximadamente -3% (você PERDEU poder de compra)","Zero"],correta:2,explicacao:"r_real ≈ 6% − 9% = <strong>-3%</strong>. Mesmo 'ganhando juros', você <strong>perdeu poder de compra</strong>. Em períodos de inflação alta, aplicações conservadoras podem render NEGATIVO em termos reais."}
];
var NOMES={1:"IPCA (conceito)",2:"Cálculo de inflação",3:"Valores reais",4:"Juros reais (Fisher)"};
var estado={principios:{},fila:[],atual:null,indice:0,totalRespondidas:0,totalAcertos:0};
function iniciarQuiz(){for(var i=1;i<=4;i++)estado.principios[i]={status:"pendente",tentativas:0,acertos:0};var p=BANCO.filter(function(q){return q.tipo==="principal"});embaralhar(p);estado.fila=p.slice();document.getElementById("tela-inicio").style.display="none";document.getElementById("painel-progresso").style.display="grid";document.getElementById("card-questao").style.display="block";atualizarPainel();exibirQuestao()}
function embaralhar(a){for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}}
function atualizarPainel(){var p=document.getElementById("painel-progresso");p.innerHTML="";for(var i=1;i<=4;i++){var s=estado.principios[i];var b=document.createElement("div");b.className="principio-badge "+s.status;b.innerHTML='<span class="num">'+i+"</span>"+NOMES[i];p.appendChild(b)}}
function exibirQuestao(){if(estado.indice>=estado.fila.length){mostrarResultado();return}var q=estado.fila[estado.indice];estado.atual=q;var tag=document.getElementById("tag-principio");tag.textContent=NOMES[q.principio];tag.className="questao-tag"+(q.tipo==="reforco"?" reforco-tag":"");document.getElementById("contador").textContent="Questão "+(estado.indice+1)+" de "+estado.fila.length+(q.tipo==="reforco"?" (reforço)":"");document.getElementById("contexto").innerHTML=q.contexto;document.getElementById("texto-questao").innerHTML=q.texto;var ul=document.getElementById("alternativas");ul.innerHTML="";for(var i=0;i<q.alternativas.length;i++){var li=document.createElement("li");var btn=document.createElement("button");btn.className="alternativa";btn.innerHTML="<strong>"+String.fromCharCode(97+i)+")</strong> "+q.alternativas[i];btn.setAttribute("data-idx",i);btn.onclick=function(){responder(parseInt(this.getAttribute("data-idx")))};li.appendChild(btn);ul.appendChild(li)}document.getElementById("feedback").style.display="none";document.getElementById("feedback").className="feedback";document.getElementById("btn-proximo").style.display="none";document.getElementById("card-questao").scrollIntoView({behavior:"smooth",block:"start"})}
function responder(escolha){var q=estado.atual;var botoes=document.querySelectorAll(".alternativa");var acertou=escolha===q.correta;for(var i=0;i<botoes.length;i++){botoes[i].classList.add("disabled");botoes[i].onclick=null;if(i===q.correta)botoes[i].classList.add("correta");if(i===escolha&&!acertou)botoes[i].classList.add("incorreta")}var p=estado.principios[q.principio];p.tentativas++;estado.totalRespondidas++;var fb=document.getElementById("feedback");if(acertou){p.acertos++;estado.totalAcertos++;if(p.status!=="errou")p.status="acertou";else p.status="reforco";fb.className="feedback acerto";fb.innerHTML="<h4>✓ Correto!</h4><p>"+q.explicacao+"</p>"}else{if(q.tipo==="principal"){p.status="errou";var r=null;for(var j=0;j<BANCO.length;j++){if(BANCO[j].principio===q.principio&&BANCO[j].tipo==="reforco"){r=BANCO[j];break}}if(r)estado.fila.splice(estado.indice+1,0,r)}else{p.status="errou"}fb.className="feedback erro";fb.innerHTML="<h4>✗ Incorreto</h4><p>"+q.explicacao+"</p>"+(q.tipo==="principal"?"<p style='margin-top:8px'><strong>→ Exercício de reforço a seguir.</strong></p>":"")}fb.style.display="block";document.getElementById("btn-proximo").style.display="inline-block";atualizarPainel()}
function proximaQuestao(){estado.indice++;exibirQuestao()}
function mostrarResultado(){document.getElementById("card-questao").style.display="none";document.getElementById("tela-resultado").style.display="block";var pct=Math.round(estado.totalAcertos/estado.totalRespondidas*100);var ne=document.getElementById("nota-final");ne.textContent=pct+"%";ne.className="nota-final "+(pct>=80?"boa":pct>=50?"media":"baixa");var me=document.getElementById("msg-resultado");if(pct>=80)me.textContent="Excelente! Você compreendeu bem IPCA, inflação e a distinção entre valores nominais e reais.";else if(pct>=50)me.textContent="Bom progresso! Alguns conceitos precisam de revisão.";else me.textContent="Revise as notas de aula e o Capítulo 24 do Mankiw.";var det=document.getElementById("resultado-detalhes");det.innerHTML="<h3>Desempenho por Conceito</h3>";var revisar=[];for(var i=1;i<=4;i++){var p=estado.principios[i];var ic,sc,st;if(p.status==="acertou"){ic="✅";sc="status-dominado";st="Dominado"}else if(p.status==="reforco"){ic="🔄";sc="status-reforcar";st="Reforçado"}else if(p.status==="errou"){ic="❌";sc="status-revisar";st="Revisar";revisar.push(i)}else{ic="⬜";sc="status-pendente";st="Pendente"}det.innerHTML+='<div class="resultado-item"><span class="resultado-icone">'+ic+'</span><span class="resultado-nome"><strong>'+NOMES[i]+'</strong></span><span class="resultado-status '+sc+'">'+st+"</span></div>"}if(revisar.length>0){var sug={1:"Revise: IPCA é o índice oficial de inflação no Brasil, calculado pelo IBGE com cesta da POF. É a referência da meta de inflação do Banco Central.",2:"Revise: inflação de uma cesta é a média ponderada das altas de preços pelos pesos de cada item. Sua inflação pessoal depende do que VOCÊ consome.",3:"Revise: para comparar valores em R$ entre anos diferentes, corrija pela inflação multiplicando pelo fator IPC_A / IPC_B. Senão, está comparando 'moedas' diferentes.",4:"Revise: Fisher (aproximação): r_real ≈ r_nominal − inflação. Inflação maior que o juro nominal = juro real negativo = perda de poder de compra."};var d=document.getElementById("dica-estudo");d.style.display="block";var h="<h4>📖 Sugestões de estudo</h4><ul>";for(var k=0;k<revisar.length;k++)h+="<li><strong>"+NOMES[revisar[k]]+":</strong> "+sug[revisar[k]]+"</li>";d.innerHTML=h+"</ul>"}atualizarPainel()}
</script>
</body>
</html>
